name: Build and verify portable (Windows)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar una Release nueva después de verificar el paquete"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[publicar-version]')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read source version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from package_release import app_version; print(app_version())"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned dependencies and local model
        shell: bash
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python scripts/install_nlp.py
          python -m pip check
      - name: Review repository and run regressions
        shell: bash
        run: |
          python scripts/audit_repository.py
          python -m pytest tests -q
          node --test tests/frontend_session.test.cjs
      - name: Build complete portable
        run: python scripts/build_portable_full.py
      - name: Verify package and real Windows startup
        shell: bash
        run: |
          python -m pytest tests -q
          python scripts/check_windows_launcher.py --keep-running
          python scripts/portable_smoke.py --use-existing --category-cases --all-categories
          python scripts/portable_smoke.py --use-existing --category-cases
          python scripts/check_grouping.py --learned-alias-cases
          python scripts/check_document_parts.py
      - name: Package reviewed source
        shell: pwsh
        run: |
          Set-Content dist/AnonimizadorJudicial-NLP/SOURCE_COMMIT.txt $env:GITHUB_SHA -Encoding ascii
          python scripts/package_release.py --output dist/AnonimizadorJudicial-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: anonimizador-windows-${{ steps.version.outputs.version }}
          path: |
            dist/AnonimizadorJudicial-Windows.zip
            dist/AnonimizadorJudicial-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publicar-version]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anonimizador-windows-${{ needs.build.outputs.version }}
          path: release-files
      - name: Create new release with verified files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Anonimizador Judicial $RELEASE_VERSION" --notes-file docs/NOTAS_VERSION.md release-files/AnonimizadorJudicial-Windows.zip release-files/AnonimizadorJudicial-Windows.zip.sha256
