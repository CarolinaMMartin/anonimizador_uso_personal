name: Build and verify portable (Windows)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar una Release nueva después de verificar el paquete"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[publicar-version]')
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      asset_name: ${{ steps.version.outputs.asset_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create isolated build environment
        shell: bash
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
      - name: Validate download metadata
        id: version
        shell: pwsh
        run: |
          $metadataJson = python -c "import json, sys; sys.path.insert(0, 'scripts'); from audit_repository import release_download_info; print(json.dumps(release_download_info()))"
          if ($LASTEXITCODE -ne 0) { throw 'Los enlaces de descarga no coinciden con la version del codigo.' }
          $metadata = $metadataJson | ConvertFrom-Json
          "version=$($metadata.version)" >> $env:GITHUB_OUTPUT
          "asset_name=$($metadata.asset_name)" >> $env:GITHUB_OUTPUT
      - name: Install pinned dependencies and local model
        shell: bash
        run: |
          python -m pip install --upgrade pip==26.3 setuptools==84.2.1
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python scripts/install_nlp.py
          python -m pip check
      - name: Review repository and run regressions
        shell: bash
        run: |
          python scripts/audit_repository.py
          python -m pytest tests -q
          node --test tests/frontend_session.test.cjs
      - name: Build complete portable
        run: python scripts/build_portable_full.py
      - name: Verify package and real Windows startup
        shell: bash
        run: |
          python -m pytest tests -q
          python scripts/check_windows_launcher.py --keep-running
          python scripts/portable_smoke.py --use-existing --category-cases --all-categories
          python scripts/portable_smoke.py --use-existing --category-cases
          python scripts/check_grouping.py --learned-alias-cases
          python scripts/check_document_parts.py
          python scripts/check_sensitive_portable.py
      - name: Package reviewed source
        env:
          RELEASE_ASSET: ${{ steps.version.outputs.asset_name }}
        shell: pwsh
        run: |
          Set-Content dist/AnonimizadorJudicial-NLP/SOURCE_COMMIT.txt $env:GITHUB_SHA -Encoding ascii
          python scripts/package_release.py --output "dist/$env:RELEASE_ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: anonimizador-windows-${{ steps.version.outputs.version }}
          path: |
            dist/${{ steps.version.outputs.asset_name }}
            dist/${{ steps.version.outputs.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publicar-version]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anonimizador-windows-${{ needs.build.outputs.version }}
          path: release-files
      - name: Create new release with verified files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_ASSET: ${{ needs.build.outputs.asset_name }}
        run: |
          python scripts/release_notes.py --commit "$GITHUB_SHA" --output release-files/NOTAS_VERSION.md
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Anonimizador Judicial $RELEASE_VERSION" --notes-file release-files/NOTAS_VERSION.md "release-files/$RELEASE_ASSET" "release-files/$RELEASE_ASSET.sha256"
