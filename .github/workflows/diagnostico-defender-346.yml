name: Contraste con Defender en Windows
on:
  push:
    branches: [diagnostico/defender-346]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.4.6'
            digest: 582109b15827496403c098f0741c13ae163372b17ea8ab51b4a6e881d6f89f28
          - version: '3.4.5'
            digest: b3360c3baad4e68d25b22e2f1e3da39c1a0835f427430ce03c3eb111d799b57d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar y examinar el portable publicado
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ matrix.version }}
          EXPECTED_SHA: ${{ matrix.digest }}
        run: |
          $v = $env:RELEASE_VERSION
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/AnonimizadorJudicial-$v-Windows.zip"
          ./scripts/check_release_defender.ps1 -Package $url -ExpectedSHA256 $env:EXPECTED_SHA
      - name: Probar la descarga en Chrome con sus protecciones activas
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ matrix.version }}
          EXPECTED_SHA: ${{ matrix.digest }}
        run: |
          python -m pip install selenium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_browser_download.py
